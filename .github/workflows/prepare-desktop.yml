name: Prepare Desktop Build

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: boolean
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Select build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node - <<'NODE'
          const fs = require('node:fs');
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const tauriVersion = tauri.version;
          if (!packageVersion || !cargoVersion || !tauriVersion || new Set([packageVersion, cargoVersion, tauriVersion]).size !== 1) {
            throw new Error(`Version mismatch: package=${packageVersion}, cargo=${cargoVersion}, tauri=${tauriVersion}`);
          }
          if (process.env.RELEASE_BUILD === 'true' && process.env.GITHUB_REF_NAME !== `v${packageVersion}`) {
            throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} must match v${packageVersion}`);
          }
          process.stdout.write(packageVersion);
          NODE
          )"
          if [[ "${{ inputs.release }}" == "true" ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_BUILD: ${{ inputs.release }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Test frontend
        run: npm test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-desktop
          if-no-files-found: error
          retention-days: 1
          path: |
            dist
            package.json
            package-lock.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
            src-tauri/tauri.conf.json
            src-tauri/icons
