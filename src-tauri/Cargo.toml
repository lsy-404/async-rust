[package]
name = "async-rust"
version = "0.1.0"
description = "A local BYOK classroom assistant"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "async_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
eventsource-stream = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
zip = "2"
quick-xml = "0.37"
tokio-util = "0.7"
url = "2"

sherpa-onnx = "=1.13.7"
sha2 = "0.10"
bzip2 = "0.5"
tar = "0.4"
symphonia = { version = "0.5", features = ["all"] }
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
base64 = "0.22"
chrono = "0.4"
axum = "0.8"
zeroize = "1"
open = "5"

fs2 = "0.4"
cpal = "0.18.2"
hound = "3.5"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

